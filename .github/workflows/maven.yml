name: CI Test Suite

permissions:
  contents: write
  packages: write

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ═══════════════════════════════════════════════════════════════════
  #  Java Unit Tests (H2 in-memory, no MySQL needed)
  # ═══════════════════════════════════════════════════════════════════
  java-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Java unit tests
        run: mvn test

  # ═══════════════════════════════════════════════════════════════════
  #  JS Unit Tests (Jest + jsdom, no browser needed)
  # ═══════════════════════════════════════════════════════════════════
  js-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run JS unit tests
        run: npm test

  # ═══════════════════════════════════════════════════════════════════
  #  Docker Build & Push (to GitHub Container Registry)
  # ═══════════════════════════════════════════════════════════════════
  docker:
    runs-on: ubuntu-latest
    needs: [java-tests, js-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ═══════════════════════════════════════════════════════════════════
  #  Integration Tests (Docker Compose: MySQL + App, API + E2E)
  # ═══════════════════════════════════════════════════════════════════
  integration-tests:
    runs-on: ubuntu-latest
    needs: [docker]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build app image (cached from docker job)
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: scooter-rental:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start services
        run: docker compose up -d --wait --no-build

      - name: Show application logs
        if: always()
        run: docker compose logs app

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests pytest-html pytest-md selenium

      # ── API Tests ──────────────────────────────────────────────
      - name: Create report directory
        run: mkdir -p test/reports_md

      - name: Run API automation tests
        run: |
          python test/test_run_all_api.py 2>&1 | \
            tee test/reports_md/api_test_report.md

      # ── E2E UI Tests ───────────────────────────────────────────
      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run E2E UI tests
        run: |
          python test/test_run_all_e2e.py 2>&1 | \
            tee test/reports_md/e2e_test_report.md

      # ── Upload artifacts ───────────────────────────────────────
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: test/reports_md/

      - name: Upload application logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-logs
          path: app.log

      # ── Cleanup ────────────────────────────────────────────────
      - name: Stop services
        if: always()
        run: docker compose down -v
